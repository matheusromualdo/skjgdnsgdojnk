<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101218"><title>Vibe — chamada em grupo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--bg:#101218;--panel:#191c25;--muted:#9096a8;--text:#f7f7fb;--accent:#a5f36b;--line:#292d38}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#293022 0,transparent 45%),var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}button,input{font:inherit}.wrap{max-width:1240px;margin:auto;padding:26px 28px 30px}.brand{display:flex;align-items:center;gap:11px;font-family:Manrope,sans-serif;font-weight:800;letter-spacing:-.04em;font-size:23px}.brand-mark{width:34px;height:34px;border-radius:12px;background:var(--accent);display:grid;place-items:center;color:#172012;font-size:18px}.eyebrow{color:var(--muted);font-size:13px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:38px}.landing{max-width:480px;margin:15vh auto 0;text-align:center}.landing h1{font:700 30px/1.15 Manrope,sans-serif;letter-spacing:-.035em;margin:0 0 8px}.landing p{color:#aeb2bf;line-height:1.55;margin:0 auto 20px;max-width:430px}.join-card{padding:28px;background:#191c25;border:1px solid #30333b;border-radius:18px;text-align:left;box-shadow:0 22px 80px #0005}.field-label{font-size:14px;font-weight:700;color:#d7d9e1;display:block;margin:18px 0 8px 2px}.fields{display:flex;gap:10px}.fields input{min-width:0;flex:1}.input{background:#101218;border:1px solid #484d5c;border-radius:12px;padding:15px;color:white;outline:none;width:100%;font-size:16px}.input::placeholder{color:#858b9b}.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #a5f36b30}.btn{border:0;border-radius:12px;background:var(--accent);color:#172012;font-weight:700;padding:13px 18px;cursor:pointer;transition:.15s;white-space:nowrap}.btn:hover{filter:brightness(1.07);transform:translateY(-1px)}.subnote{color:#858b9b;font-size:12px;text-align:center;margin:14px 0 0}.call{display:none}.call-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.room-title{font:700 22px Manrope,sans-serif}.live{font-size:12px;color:var(--accent);display:flex;align-items:center;gap:8px}.live:before{content:'';width:8px;height:8px;background:var(--accent);border-radius:50%;box-shadow:0 0 12px #a5f36b99}.room-controls{display:flex;gap:9px}.icon-btn{background:#20232d;color:white;border:1px solid #323641;border-radius:12px;padding:10px 13px;cursor:pointer}.icon-btn.active{background:#342326;border-color:#704047;color:#ff9d9d}.icon-btn.on{background:#26311f;border-color:#485b3a;color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));grid-auto-rows:minmax(250px,calc((100vh - 260px)/2));gap:14px}.tile{position:relative;min-height:240px;overflow:hidden;border:1px solid #30333e;border-radius:20px;background:linear-gradient(145deg,#232632,#171921 65%);display:grid;place-items:center}.tile video{height:100%;width:100%;object-fit:cover;position:absolute;inset:0;transform:scaleX(-1)}.avatar{height:100px;width:100px;border-radius:35px;background:#303a2b;color:var(--accent);display:grid;place-items:center;font:700 40px Manrope,sans-serif;box-shadow:0 12px 55px #0006}.tile-info{position:absolute;bottom:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center}.name-chip{padding:8px 11px;border:1px solid #ffffff20;background:#101218c9;border-radius:10px;font-size:13px}.mic-state{font-size:12px;color:#d6d7de;background:#101218c9;border-radius:10px;padding:8px}.bottom{display:flex;justify-content:center;gap:10px;margin:22px 0}.leave{background:#e75f63;color:white}.people{color:#aaa;font-size:13px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#30343f;border:1px solid #424653;padding:11px 16px;border-radius:12px;display:none;z-index:9}.toast.show{display:block}@media(max-width:600px){.wrap{padding:18px 14px}.top{margin-bottom:25px}.landing{margin-top:12vh}.join-card{padding:20px}.fields{flex-direction:column}.fields .btn{width:100%}.call-head{align-items:flex-start;gap:12px;flex-direction:column}.grid{grid-auto-rows:260px}.room-controls{position:absolute;right:14px;top:15px}}
  </style>
</head>
<body><main class="wrap">
  <header class="top"><div class="brand"><span class="brand-mark">✳</span>vibe</div></header>
  <section id="landing" class="landing"><div class="join-card"><h1>Entrar na chamada</h1><p class="subnote">Digite seu nome para continuar.</p><form id="joinForm"><label class="field-label" for="display-name">Seu nome</label><div class="fields"><input class="input" id="display-name" type="text" maxlength="30" placeholder="Digite seu nome aqui" autocomplete="nickname" autofocus required><button class="btn" id="join" type="submit">Entrar <span aria-hidden="true">→</span></button></div></form><p class="subnote">Seu navegador pode pedir acesso ao microfone e à câmera.</p></div></section>
  <section id="call" class="call"><div class="call-head"><div><div class="room-title">Sala da galera</div><div class="eyebrow" id="roomMeta">Conectando…</div></div><div class="room-controls"><button class="icon-btn on" id="mic" title="Desligar microfone">🎙️ <span>Microfone</span></button><button class="icon-btn on" id="camera" title="Desligar câmera">📹 <span>Câmera</span></button><button class="icon-btn" id="copy">⧉ <span>Copiar link</span></button></div></div><div class="grid" id="grid"></div><div class="bottom"><button class="btn leave" id="leave">↗ &nbsp;Sair da chamada</button></div></section>
</main><div class="toast" id="toast"></div>
<script>
(()=>{const $=id=>document.getElementById(id), landing=$('landing'),call=$('call'),grid=$('grid');let myName='',room='',localStream=null,peers={},people={},cursor='',clientId=globalThis.crypto?.randomUUID?.()||`v${Date.now()}${Math.random().toString(36).slice(2)}`,timer,muted=false,cameraOff=false,joining=false;
const config={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},{urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'}]};
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2600)}
function initials(s){return (s||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function render(){grid.innerHTML='';const all=[{id:clientId,name:myName+' (você)',stream:localStream,self:true},...Object.entries(people).map(([id,p])=>({id,...p}))];$('roomMeta').textContent=`${all.length} ${all.length===1?'pessoa':'pessoas'} na sala · ${room}`;all.forEach(p=>{const tile=document.createElement('div');tile.className='tile';if(p.stream&&!(p.self&&cameraOff)){const v=document.createElement('video');v.autoplay=true;v.playsInline=true;v.muted=p.self;v.srcObject=p.stream;tile.appendChild(v)}else{const a=document.createElement('div');a.className='avatar';a.textContent=initials(p.name);tile.appendChild(a)}const info=document.createElement('div');info.className='tile-info';const n=document.createElement('span');n.className='name-chip';n.textContent=p.name;const state=document.createElement('span');state.className='mic-state';state.textContent=p.self?(muted?'🔇 Silenciado':'🎙️ Com áudio'):'🎙️';info.append(n,state);tile.appendChild(info);grid.appendChild(tile)})}
async function api(action,data={}){const r=await fetch('/.netlify/functions/signal',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,room,clientId,name:myName,...data})});if(!r.ok)throw Error('Falha na conexão com a sala');return r.json()}
async function send(to,data){try{await api('send',{to,data})}catch(e){console.error(e)}}
function newPeer(id,n){const pc=new RTCPeerConnection(config);peers[id]=pc;if(localStream)localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));pc.onicecandidate=e=>e.candidate&&send(id,{candidate:e.candidate});pc.ontrack=e=>{people[id]={name:n,stream:e.streams[0]};render()};pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed'||pc.connectionState==='closed')drop(id)};return pc}
async function callPeer(id,n){if(peers[id])return;people[id]={name:n};render();const pc=newPeer(id,n);const offer=await pc.createOffer();await pc.setLocalDescription(offer);await send(id,{sdp:pc.localDescription,name:myName})}
async function receive(ev){const {from,data}=ev;if(!from||from===clientId)return;let pc=peers[from];if(data.sdp?.type==='offer'){if(!pc){people[from]={name:data.name||'Amigo'};pc=newPeer(from,people[from].name)}await pc.setRemoteDescription(data.sdp);const answer=await pc.createAnswer();await pc.setLocalDescription(answer);await send(from,{sdp:pc.localDescription})}else if(data.sdp?.type==='answer'&&pc){await pc.setRemoteDescription(data.sdp)}else if(data.candidate&&pc){try{await pc.addIceCandidate(data.candidate)}catch(e){}}
}
function drop(id){if(peers[id]){peers[id].close();delete peers[id]}delete people[id];render()}
async function poll(){try{const d=await api('poll',{cursor});if(d.events){d.events.forEach(ev=>{if(ev.seq>cursor)cursor=ev.seq;if(ev.from===clientId)return;if(ev.kind==='join'){people[ev.from]={name:ev.name||'Amigo'};render();if(clientId<ev.from)callPeer(ev.from,ev.name||'Amigo')}else if(ev.kind==='leave')drop(ev.from);else if(ev.kind==='signal')receive({from:ev.from,data:ev.data})})}}catch(e){console.error(e)}}
async function join(){if(joining)return;joining=true;myName=$('display-name').value.trim()||'Sem nome';room=new URLSearchParams(location.search).get('sala')||Math.random().toString(36).slice(2,8).toUpperCase();try{try{localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:true})}catch(e){toast('Não consegui acessar câmera e microfone. Você pode entrar sem mídia.');try{localStream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(_){localStream=null}}landing.style.display='none';call.style.display='block';render();const joined=await api('join');(joined.peers||[]).forEach(p=>{people[p.id]={name:p.name};if(clientId<p.id)callPeer(p.id,p.name)});timer=setInterval(poll,1200);await poll();}catch(e){toast('Não conectou. Confira se publicou pelo Netlify com as funções ativadas.');console.error(e);landing.style.display='block';call.style.display='none'}finally{joining=false}}
async function leave(){clearInterval(timer);try{await api('leave')}catch(e){}Object.keys(peers).forEach(drop);if(localStream)localStream.getTracks().forEach(t=>t.stop());localStream=null;location.href=location.pathname}
$('joinForm').addEventListener('submit',e=>{e.preventDefault();join()});$('leave').onclick=leave;$('mic').onclick=()=>{muted=!muted;localStream?.getAudioTracks().forEach(t=>t.enabled=!muted);$('mic').classList.toggle('active',muted);$('mic').classList.toggle('on',!muted);$('mic').title=muted?'Ligar microfone':'Desligar microfone';render()};$('camera').onclick=()=>{cameraOff=!cameraOff;localStream?.getVideoTracks().forEach(t=>t.enabled=!cameraOff);$('camera').classList.toggle('active',cameraOff);$('camera').classList.toggle('on',!cameraOff);$('camera').title=cameraOff?'Ligar câmera':'Desligar câmera';if(cameraOff){Object.values(people).forEach(p=>{});render();toast('Câmera desligada')}else render()};$('copy').onclick=async()=>{const u=new URL(location.href);u.searchParams.set('sala',room);await navigator.clipboard.writeText(u.href);toast('Link copiado! Manda pra galera.')};window.addEventListener('beforeunload',()=>{if(timer)navigator.sendBeacon('/.netlify/functions/signal',new Blob([JSON.stringify({action:'leave',room,clientId})],{type:'application/json'}))});
})();
</script></body></html>
